    <path d="M 0 27 C 1.5 25.4 1.6 24.1 0 23.4 C -1.6 24.1 -1.5 25.4 0 27 Z" fill="#6F2491" />
    <circle cx="-4.2" cy="-21.4" r="0.95" fill="#4E166A" />
    <circle cx="4.2" cy="-21.4" r="0.95" fill="#4E166A" />
    <circle cx="-4.2" cy="21.4" r="0.95" fill="#4E166A" />
    <circle cx="4.2" cy="21.4" r="0.95" fill="#4E166A" />
    <circle cx="20.2" cy="0" r="1.1" fill="#4E166A" />
    <circle cx="18.8" cy="-16.5" r="0.95" fill="#6F2491" />
    <circle cx="18.8" cy="16.5" r="0.95" fill="#6F2491" />
