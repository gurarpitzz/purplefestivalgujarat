        <path d="M 0 -16 C 2 -13 3 -10.5 2 -8.2 C 1 -7 0 -6.8 0 -6.8 C 0 -6.8 -1 -7 -2 -8.2 C -3 -10.5 -2 -13 0 -16 Z" fill="#6F2491" stroke="none" />
