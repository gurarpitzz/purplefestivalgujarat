<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 240" width="68" height="240" fill="none">
  <!-- Clean, airy Gujarati folk-art border with generous negative space (viewBox 68x240 seamless repeat-y) -->

  <!-- Outer vertical rail: slim hairline + airy pearl column + crisp outer edge -->
  <g id="pfg-rail">
    <line x1="55" y1="0" x2="55" y2="240" stroke="#5A1F7A" stroke-width="1.25" />
    <line x1="64" y1="0" x2="64" y2="240" stroke="#5A1F7A" stroke-width="2.2" />
    <g fill="#7B35A2">
      <circle cx="59.5" cy="10" r="1.35" />
      <circle cx="59.5" cy="30" r="1.35" />
      <circle cx="59.5" cy="50" r="1.35" />
      <circle cx="59.5" cy="70" r="1.35" />
      <circle cx="59.5" cy="90" r="1.35" />
      <circle cx="59.5" cy="110" r="1.35" />
      <circle cx="59.5" cy="130" r="1.35" />
      <circle cx="59.5" cy="150" r="1.35" />
      <circle cx="59.5" cy="170" r="1.35" />
      <circle cx="59.5" cy="190" r="1.35" />
      <circle cx="59.5" cy="210" r="1.35" />
      <circle cx="59.5" cy="230" r="1.35" />
    </g>
  </g>

  <!-- Minimalist Seam Diamond Accent (y = 0 and y = 240 connect seamlessly) -->
  <g transform="translate(28 0)">
    <path d="M 0 -6 L 6 0 L 0 6 L -6 0 Z" stroke="#5A1F7A" stroke-width="1.35" />
    <circle cx="0" cy="0" r="1.8" fill="#7B35A2" />
    <circle cx="-13" cy="0" r="1.25" fill="#7B35A2" />
    <circle cx="13" cy="0" r="1.25" fill="#7B35A2" />
  </g>
  <g transform="translate(28 240)">
    <path d="M 0 -6 L 6 0 L 0 6 L -6 0 Z" stroke="#5A1F7A" stroke-width="1.35" />
    <circle cx="0" cy="0" r="1.8" fill="#7B35A2" />
    <circle cx="-13" cy="0" r="1.25" fill="#7B35A2" />
    <circle cx="13" cy="0" r="1.25" fill="#7B35A2" />
  </g>

  <!-- Motif 1: Open, Breathable 8-Petal Gujarati Lotus Blossom (centered at 28, 60) -->
  <g transform="translate(28 60)">
    <!-- Subtle vertical stem pearls giving graceful rhythm with ample white space -->
    <circle cx="0" cy="-27" r="1.45" fill="#7B35A2" />
    <circle cx="0" cy="27" r="1.45" fill="#7B35A2" />

    <!-- 4 diagonal airy outline petals -->
    <g stroke="#7B35A2" stroke-width="1.25" stroke-linejoin="round">
      <path transform="rotate(45)" d="M 0 -18 C 3.4 -13.5 4.4 -9.2 2.4 -6.4 C 1.2 -5.2 0 -5 0 -5 C 0 -5 -1.2 -5.2 -2.4 -6.4 C -4.4 -9.2 -3.4 -13.5 0 -18 Z" />
      <path transform="rotate(135)" d="M 0 -18 C 3.4 -13.5 4.4 -9.2 2.4 -6.4 C 1.2 -5.2 0 -5 0 -5 C 0 -5 -1.2 -5.2 -2.4 -6.4 C -4.4 -9.2 -3.4 -13.5 0 -18 Z" />
      <path transform="rotate(225)" d="M 0 -18 C 3.4 -13.5 4.4 -9.2 2.4 -6.4 C 1.2 -5.2 0 -5 0 -5 C 0 -5 -1.2 -5.2 -2.4 -6.4 C -4.4 -9.2 -3.4 -13.5 0 -18 Z" />
      <path transform="rotate(315)" d="M 0 -18 C 3.4 -13.5 4.4 -9.2 2.4 -6.4 C 1.2 -5.2 0 -5 0 -5 C 0 -5 -1.2 -5.2 -2.4 -6.4 C -4.4 -9.2 -3.4 -13.5 0 -18 Z" />
    </g>

    <!-- 4 cardinal sculptural lotus petals (open outline + delicate solid inner bud) -->
    <g stroke="#5A1F7A" stroke-width="1.5" stroke-linejoin="round">
      <g>
        <path d="M 0 -21 C 4.2 -15.8 5.8 -10.8 3.6 -6.8 C 2.1 -5.2 0 -5 0 -5 C 0 -5 -2.1 -5.2 -3.6 -6.8 C -5.8 -10.8 -4.2 -15.8 0 -21 Z" />
        <path d="M 0 -15.2 C 1.5 -12.4 1.9 -10 0 -8.2 C -1.9 -10 -1.5 -12.4 0 -15.2 Z" fill="#5A1F7A" stroke="none" />
      </g>
      <g transform="rotate(90)">
        <path d="M 0 -19.5 C 4 -14.8 5.4 -10.2 3.4 -6.6 C 2 -5.2 0 -5 0 -5 C 0 -5 -2 -5.2 -3.4 -6.6 C -5.4 -10.2 -4 -14.8 0 -19.5 Z" />
        <path d="M 0 -14.2 C 1.4 -11.6 1.8 -9.6 0 -8 C -1.8 -9.6 -1.4 -11.6 0 -14.2 Z" fill="#5A1F7A" stroke="none" />
      </g>
      <g transform="rotate(180)">
        <path d="M 0 -21 C 4.2 -15.8 5.8 -10.8 3.6 -6.8 C 2.1 -5.2 0 -5 0 -5 C 0 -5 -2.1 -5.2 -3.6 -6.8 C -5.8 -10.8 -4.2 -15.8 0 -21 Z" />
        <path d="M 0 -15.2 C 1.5 -12.4 1.9 -10 0 -8.2 C -1.9 -10 -1.5 -12.4 0 -15.2 Z" fill="#5A1F7A" stroke="none" />
      </g>
      <g transform="rotate(270)">
        <path d="M 0 -19.5 C 4 -14.8 5.4 -10.2 3.4 -6.6 C 2 -5.2 0 -5 0 -5 C 0 -5 -2 -5.2 -3.4 -6.6 C -5.4 -10.2 -4 -14.8 0 -19.5 Z" />
        <path d="M 0 -14.2 C 1.4 -11.6 1.8 -9.6 0 -8 C -1.8 -9.6 -1.4 -11.6 0 -14.2 Z" fill="#5A1F7A" stroke="none" />
      </g>
    </g>

    <!-- Open circular lotus core -->
    <circle cx="0" cy="0" r="5.2" stroke="#5A1F7A" stroke-width="1.4" />
    <circle cx="0" cy="0" r="2" fill="#7B35A2" />
  </g>

  <!-- Mid-Tile Airy Diamond Spacer (centered at 28, 120) -->
  <g transform="translate(28 120)">
    <path d="M 0 -6 L 6 0 L 0 6 L -6 0 Z" stroke="#5A1F7A" stroke-width="1.35" />
    <circle cx="0" cy="0" r="1.8" fill="#7B35A2" />
    <circle cx="-13" cy="0" r="1.25" fill="#7B35A2" />
    <circle cx="13" cy="0" r="1.25" fill="#7B35A2" />
  </g>

  <!-- Motif 2: Clean Open Ogee Diamond Medallion (centered at 28, 180) -->
  <g transform="translate(28 180)">
    <circle cx="0" cy="-27" r="1.45" fill="#7B35A2" />
    <circle cx="0" cy="27" r="1.45" fill="#7B35A2" />

    <!-- Single crisp outer ogee diamond frame -->
    <path
      d="M 0 -21.5 C 5.2 -14.5 11.2 -8.2 17.2 0 C 11.2 8.2 5.2 14.5 0 21.5 C -5.2 14.5 -11.2 8.2 -17.2 0 C -11.2 -8.2 -5.2 -14.5 0 -21.5 Z"
      stroke="#5A1F7A"
      stroke-width="1.55"
      stroke-linejoin="round"
    />

    <!-- Airy inner diamond hairline -->
    <path
      d="M 0 -14.5 L 11.5 0 L 0 14.5 L -11.5 0 Z"
      stroke="#7B35A2"
      stroke-width="1.15"
      stroke-linejoin="round"
    />

    <!-- Delicate 4-point inner star -->
    <path
      d="M 0 -8.5 L 2.2 -2.2 L 7.5 0 L 2.2 2.2 L 0 8.5 L -2.2 2.2 L -7.5 0 L -2.2 -2.2 Z"
      fill="#5A1F7A"
    />
    <circle cx="0" cy="0" r="1.6" fill="#FBF8F1" />

    <!-- Subtle outer side pearls (plenty of breathing space) -->
    <circle cx="-21.5" cy="0" r="1.35" fill="#7B35A2" />
    <circle cx="21.5" cy="0" r="1.35" fill="#7B35A2" />
  </g>
</svg>
