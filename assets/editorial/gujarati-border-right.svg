        <path d="M 0 -15.4 C 1.8 -12.4 2.4 -9.8 1.5 -7.8 C 0.8 -6.8 0 -6.6 0 -6.6 C 0 -6.6 -0.8 -6.8 -1.5 -7.8 C -2.4 -9.8 -1.8 -12.4 0 -15.4 Z" fill="#4E166A" stroke="none" />
