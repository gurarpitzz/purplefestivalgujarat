      <path d="M 0 -13.4 C 2.3 -9.8 3.1 -6.8 1.6 -4.6 C 0.8 -3.7 0 -3.5 0 -3.5 C 0 -3.5 -0.8 -3.7 -1.6 -4.6 C -3.1 -6.8 -2.3 -9.8 0 -13.4 Z" />
      <path d="M 0 13.4 C 2.3 9.8 3.1 6.8 1.6 4.6 C 0.8 3.7 0 3.5 0 3.5 C 0 3.5 -0.8 3.7 -1.6 4.6 C -3.1 6.8 -2.3 9.8 0 13.4 Z" />
      <path d="M -11 0 C -8 -2 -5.5 -2.6 -3.8 -1.4 C -3.1 -0.8 -3 0 -3 0 C -3 0 -3.1 0.8 -3.8 1.4 C -5.5 2.6 -8 2 -11 0 Z" />
      <path d="M 11 0 C 8 -2 5.5 -2.6 3.8 -1.4 C 3.1 -0.8 3 0 3 0 C 3 0 3.1 0.8 3.8 1.4 C 5.5 2.6 8 2 11 0 Z" />
