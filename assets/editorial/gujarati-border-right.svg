        <path d="M 0 -22.2 C 3.8 -17.4 6.8 -12.8 5.2 -7.4 C 3.6 -5.2 1.8 -4.8 0 -4.8 C -1.8 -4.8 -3.6 -5.2 -5.2 -7.4 C -6.8 -12.8 -3.8 -17.4 0 -22.2 Z" />
