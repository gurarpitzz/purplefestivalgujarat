<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 280" width="260" height="280" fill="none" aria-hidden="true">
  <!-- Gujarati Diamond-Lotus Editorial Hero Ornament (Deep Plum Surface) -->
  <!-- Right vertical ornamental rail + scalloped lotus frieze -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical double rails & central pearl dots -->
    <line x1="208" y1="6" x2="208" y2="274" stroke="#F5BF4F" stroke-width="2.2" />
    <line x1="215" y1="6" x2="215" y2="274" stroke="#A655D9" stroke-width="1.6" stroke-dasharray="2 7" />
    <line x1="222" y1="6" x2="222" y2="274" stroke="#F5BF4F" stroke-width="2.2" />

    <!-- Right-edge alternating lavender & gold lotus fan motifs -->
    <g transform="translate(226, 22)">
      <path d="M2,12 C11,4 22,2 27,8 C22,14 11,15 2,12 Z" fill="#A655D9" />
      <path d="M2,12 C11,10 23,12 28,19 C20,22 10,18 2,12 Z" fill="#F5BF4F" />
      <path d="M2,12 C10,17 18,24 19,31 C11,28 6,21 2,12 Z" fill="#A655D9" />
      <circle cx="5" cy="12" r="2.2" fill="#FBF7EE" />
    </g>
    <g transform="translate(226, 68)">
      <path d="M2,14 C10,5 21,2 26,8 C21,15 11,16 2,14 Z" fill="#F5BF4F" />
      <path d="M2,14 C12,13 23,16 27,23 C19,25 10,20 2,14 Z" fill="#A655D9" />
      <path d="M2,14 C9,21 16,28 16,35 C9,31 5,23 2,14 Z" fill="#F5BF4F" />
      <circle cx="5" cy="14" r="2.2" fill="#FBF7EE" />
    </g>
    <g transform="translate(226, 118)">
      <path d="M2,14 C11,6 22,4 28,11 C22,16 11,17 2,14 Z" fill="#A655D9" />
      <path d="M2,14 C12,14 23,17 27,24 C19,26 10,21 2,14 Z" fill="#F5BF4F" />
      <path d="M2,14 C10,21 17,28 18,35 C10,31 6,23 2,14 Z" fill="#A655D9" />
      <circle cx="5" cy="14" r="2.2" fill="#FBF7EE" />
    </g>
    <g transform="translate(226, 168)">
      <path d="M2,14 C10,5 21,2 26,8 C21,15 11,16 2,14 Z" fill="#F5BF4F" />
      <path d="M2,14 C12,13 23,16 27,23 C19,25 10,20 2,14 Z" fill="#A655D9" />
      <path d="M2,14 C9,21 16,28 16,35 C9,31 5,23 2,14 Z" fill="#F5BF4F" />
      <circle cx="5" cy="14" r="2.2" fill="#FBF7EE" />
    </g>
    <g transform="translate(226, 218)">
      <path d="M2,14 C11,6 22,4 28,11 C22,16 11,17 2,14 Z" fill="#A655D9" />
      <path d="M2,14 C12,14 23,17 27,24 C19,26 10,21 2,14 Z" fill="#F5BF4F" />
      <path d="M2,14 C10,21 17,28 18,35 C10,31 6,23 2,14 Z" fill="#A655D9" />
      <circle cx="5" cy="14" r="2.2" fill="#FBF7EE" />
    </g>

    <!-- Top & bottom golden lotus fan accents flanking the central diamond -->
    <g transform="translate(120, 34)">
      <path d="M0,18 C-6,5 -16,-3 -22,2 C-20,10 -10,16 0,18 Z" fill="#F5BF4F" />
      <path d="M0,18 C-4,3 -9,-10 -1,-14 C5,-9 4,4 0,18 Z" fill="#F5BF4F" />
      <path d="M0,18 C6,5 16,-3 22,2 C20,10 10,16 0,18 Z" fill="#F5BF4F" />
      <path d="M0,18 C-10,11 -22,9 -28,15 C-21,20 -10,20 0,18 Z" fill="#A655D9" />
      <path d="M0,18 C10,11 22,9 28,15 C21,20 10,20 0,18 Z" fill="#A655D9" />
      <circle cx="0" cy="16" r="3" fill="#FBF7EE" />
    </g>

    <g transform="translate(120, 246) scale(1, -1)">
      <path d="M0,18 C-6,5 -16,-3 -22,2 C-20,10 -10,16 0,18 Z" fill="#F5BF4F" />
      <path d="M0,18 C-4,3 -9,-10 -1,-14 C5,-9 4,4 0,18 Z" fill="#F5BF4F" />
      <path d="M0,18 C6,5 16,-3 22,2 C20,10 10,16 0,18 Z" fill="#F5BF4F" />
      <path d="M0,18 C-10,11 -22,9 -28,15 C-21,20 -10,20 0,18 Z" fill="#A655D9" />
      <path d="M0,18 C10,11 22,9 28,15 C21,20 10,20 0,18 Z" fill="#A655D9" />
      <circle cx="0" cy="16" r="3" fill="#FBF7EE" />
    </g>

    <!-- Corner accent buds near vertical rail -->
    <g transform="translate(182, 22)">
      <path d="M12,18 C6,8 4,-2 10,-6 C16,-2 17,8 12,18 Z" fill="#F5BF4F" />
      <path d="M12,18 C2,14 -6,8 -4,2 C3,2 9,9 12,18 Z" fill="#A655D9" />
      <circle cx="12" cy="18" r="2.2" fill="#FBF7EE" />
    </g>
    <g transform="translate(182, 258) scale(1, -1)">
      <path d="M12,18 C6,8 4,-2 10,-6 C16,-2 17,8 12,18 Z" fill="#F5BF4F" />
      <path d="M12,18 C2,14 -6,8 -4,2 C3,2 9,9 12,18 Z" fill="#A655D9" />
      <circle cx="12" cy="18" r="2.2" fill="#FBF7EE" />
    </g>

    <!-- Main Central Diamond Medallion (centered at x=122, y=140) -->
    <!-- Outer dotted diamond halo -->
    <polygon
      points="122,40 202,140 122,240 42,140"
      stroke="#FBF7EE"
      stroke-width="2"
      stroke-dasharray="2.5 7.5"
      opacity="0.88"
    />
    <!-- Outer royal violet diamond frame -->
    <polygon
      points="122,52 192,140 122,228 52,140"
      stroke="#A655D9"
      stroke-width="3"
      fill="#481663"
      fill-opacity="0.55"
    />
    <!-- Inner golden hairline diamond -->
    <polygon
      points="122,64 182,140 122,216 62,140"
      stroke="#F5BF4F"
      stroke-width="1.6"
      fill="#2C0A3F"
      fill-opacity="0.72"
    />
    <!-- Innermost dotted diamond -->
    <polygon
      points="122,74 174,140 122,206 70,140"
      stroke="#F5BF4F"
      stroke-width="1.4"
      stroke-dasharray="2 6"
      opacity="0.85"
    />

    <!-- Corner diamond finials -->
    <circle cx="34" cy="140" r="3.5" fill="#F5BF4F" />
    <circle cx="24" cy="140" r="2" fill="#A655D9" />
    <circle cx="122" cy="30" r="2.5" fill="#FBF7EE" />
    <circle cx="122" cy="250" r="2.5" fill="#FBF7EE" />

    <!-- Central 8-Petal Gujarati Lotus Blossom (centered at 122, 140) -->
    <g transform="translate(122, 140)">
      <!-- Diagonal lavender secondary petals -->
      <path d="M0,0 C-10,-16 -24,-22 -30,-30 C-18,-26 -10,-16 0,0 Z" fill="#A655D9" />
      <path d="M0,0 C10,-16 24,-22 30,-30 C18,-26 10,-16 0,0 Z" fill="#A655D9" />
      <path d="M0,0 C-10,16 -24,22 -30,30 C-18,26 -10,16 0,0 Z" fill="#A655D9" />
      <path d="M0,0 C10,16 24,22 30,30 C18,26 10,16 0,0 Z" fill="#A655D9" />

      <!-- Cardinal golden primary lotus petals (N, S, E, W) -->
      <path d="M0,-6 C-11,-18 -10,-36 0,-48 C10,-36 11,-18 0,-6 Z" fill="#F5BF4F" />
      <path d="M0,6 C-11,18 -10,36 0,48 C10,36 11,18 0,6 Z" fill="#F5BF4F" />
      <path d="M-6,0 C-18,-11 -36,-10 -48,0 C-36,10 -18,11 -6,0 Z" fill="#F5BF4F" />
      <path d="M6,0 C18,-11 36,-10 48,0 C36,10 18,11 6,0 Z" fill="#F5BF4F" />

      <!-- Diagonal golden teardrop petals -->
      <path d="M-5,-5 C-14,-8 -23,-14 -28,-28 C-14,-23 -8,-14 -5,-5 Z" fill="#F5BF4F" opacity="0.92" />
      <path d="M5,-5 C14,-8 23,-14 28,-28 C14,-23 8,-14 5,-5 Z" fill="#F5BF4F" opacity="0.92" />
      <path d="M-5,5 C-14,8 -23,14 -28,28 C-14,23 -8,14 -5,5 Z" fill="#F5BF4F" opacity="0.92" />
      <path d="M5,5 C14,8 23,14 28,28 C14,23 8,14 5,5 Z" fill="#F5BF4F" opacity="0.92" />

      <!-- Inner plum ring & bright ivory-gold rosette core -->
      <circle cx="0" cy="0" r="14" fill="#330C47" stroke="#FBF7EE" stroke-width="1.6" />
      <circle cx="0" cy="0" r="7.5" fill="#A655D9" />
      <circle cx="0" cy="0" r="3.6" fill="#F5BF4F" />

      <!-- Tiny ivory dots around outer petal tips -->
      <circle cx="0" cy="-54" r="2.2" fill="#FBF7EE" />
      <circle cx="0" cy="54" r="2.2" fill="#FBF7EE" />
      <circle cx="-54" cy="0" r="2.2" fill="#FBF7EE" />
      <circle cx="54" cy="0" r="2.2" fill="#FBF7EE" />
    </g>
  </g>
</svg>

