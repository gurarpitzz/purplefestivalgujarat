<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380" preserveAspectRatio="xMaxYMid slice" fill="none" aria-hidden="true">
  <!-- Full-height Gujarati Diamond-Lotus & Scalloped Border Hero Banner Ornament -->
  <!-- Spans y=0..380 edge-to-edge vertically and hugs the right edge of the banner -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Full-height vertical double rails & central dotted pearl seam (y=0..380 flush!) -->
    <line x1="252" y1="0" x2="252" y2="380" stroke="#F5BF4F" stroke-width="2.6" />
    <line x1="261" y1="0" x2="261" y2="380" stroke="#B668E8" stroke-width="2" stroke-dasharray="2.5 8.5" />
    <line x1="270" y1="0" x2="270" y2="380" stroke="#F5BF4F" stroke-width="2.8" />

    <!-- Right-edge continuous alternating violet & gold lotus fan frieze (y=0..380) -->
    <g transform="translate(274, -4)">
      <path d="M0,18 C14,6 30,2 38,11 C31,19 15,21 0,18 Z" fill="#A655D9" />
      <path d="M0,18 C15,17 31,20 37,29 C26,33 12,26 0,18 Z" fill="#F5BF4F" />
      <path d="M0,18 C12,27 22,36 24,45 C13,40 6,30 0,18 Z" fill="#A655D9" />
      <circle cx="5" cy="18" r="2.8" fill="#FBF7EE" />
    </g>
    <g transform="translate(274, 52)">
      <path d="M0,18 C13,6 29,2 37,11 C30,19 14,21 0,18 Z" fill="#F5BF4F" />
      <path d="M0,18 C15,17 31,20 37,29 C26,33 12,26 0,18 Z" fill="#A655D9" />
      <path d="M0,18 C12,27 22,36 24,45 C13,40 6,30 0,18 Z" fill="#F5BF4F" />
      <circle cx="5" cy="18" r="2.8" fill="#FBF7EE" />
    </g>
    <g transform="translate(274, 108)">
      <path d="M0,18 C14,6 30,2 38,11 C31,19 15,21 0,18 Z" fill="#A655D9" />
      <path d="M0,18 C15,17 31,20 37,29 C26,33 12,26 0,18 Z" fill="#F5BF4F" />
      <path d="M0,18 C12,27 22,36 24,45 C13,40 6,30 0,18 Z" fill="#A655D9" />
      <circle cx="5" cy="18" r="2.8" fill="#FBF7EE" />
    </g>
    <g transform="translate(274, 164)">
      <path d="M0,18 C13,6 29,2 37,11 C30,19 14,21 0,18 Z" fill="#F5BF4F" />
      <path d="M0,18 C15,17 31,20 37,29 C26,33 12,26 0,18 Z" fill="#A655D9" />
      <path d="M0,18 C12,27 22,36 24,45 C13,40 6,30 0,18 Z" fill="#F5BF4F" />
      <circle cx="5" cy="18" r="2.8" fill="#FBF7EE" />
    </g>
    <g transform="translate(274, 220)">
      <path d="M0,18 C14,6 30,2 38,11 C31,19 15,21 0,18 Z" fill="#A655D9" />
      <path d="M0,18 C15,17 31,20 37,29 C26,33 12,26 0,18 Z" fill="#F5BF4F" />
      <path d="M0,18 C12,27 22,36 24,45 C13,40 6,30 0,18 Z" fill="#A655D9" />
      <circle cx="5" cy="18" r="2.8" fill="#FBF7EE" />
    </g>
    <g transform="translate(274, 276)">
      <path d="M0,18 C13,6 29,2 37,11 C30,19 14,21 0,18 Z" fill="#F5BF4F" />
      <path d="M0,18 C15,17 31,20 37,29 C26,33 12,26 0,18 Z" fill="#A655D9" />
      <path d="M0,18 C12,27 22,36 24,45 C13,40 6,30 0,18 Z" fill="#F5BF4F" />
      <circle cx="5" cy="18" r="2.8" fill="#FBF7EE" />
    </g>
    <g transform="translate(274, 332)">
      <path d="M0,18 C14,6 30,2 38,11 C31,19 15,21 0,18 Z" fill="#A655D9" />
      <path d="M0,18 C15,17 31,20 37,29 C26,33 12,26 0,18 Z" fill="#F5BF4F" />
      <path d="M0,18 C12,27 22,36 24,45 C13,40 6,30 0,18 Z" fill="#A655D9" />
      <circle cx="5" cy="18" r="2.8" fill="#FBF7EE" />
    </g>

    <!-- Upper & lower golden lotus fan crowns framing the diamond -->
    <g transform="translate(148, 38)">
      <path d="M0,22 C-9,6 -22,-5 -31,2 C-27,13 -14,20 0,22 Z" fill="#F5BF4F" />
      <path d="M0,22 C-5,4 -11,-14 -1,-19 C7,-13 6,5 0,22 Z" fill="#F5BF4F" />
      <path d="M0,22 C9,6 22,-5 31,2 C27,13 14,20 0,22 Z" fill="#F5BF4F" />
      <path d="M0,22 C-14,13 -31,11 -39,19 C-29,26 -14,25 0,22 Z" fill="#A655D9" />
      <path d="M0,22 C14,13 31,11 39,19 C29,26 14,25 0,22 Z" fill="#A655D9" />
      <circle cx="0" cy="21" r="4" fill="#FBF7EE" />
    </g>

    <g transform="translate(148, 342) scale(1, -1)">
      <path d="M0,22 C-9,6 -22,-5 -31,2 C-27,13 -14,20 0,22 Z" fill="#F5BF4F" />
      <path d="M0,22 C-5,4 -11,-14 -1,-19 C7,-13 6,5 0,22 Z" fill="#F5BF4F" />
      <path d="M0,22 C9,6 22,-5 31,2 C27,13 14,20 0,22 Z" fill="#F5BF4F" />
      <path d="M0,22 C-14,13 -31,11 -39,19 C-29,26 -14,25 0,22 Z" fill="#A655D9" />
      <path d="M0,22 C14,13 31,11 39,19 C29,26 14,25 0,22 Z" fill="#A655D9" />
      <circle cx="0" cy="21" r="4" fill="#FBF7EE" />
    </g>

    <!-- Upper & lower rail corner buds hugging the vertical gold rail -->
    <g transform="translate(222, 26)">
      <path d="M16,24 C8,10 5,-4 13,-10 C21,-4 23,10 16,24 Z" fill="#F5BF4F" />
      <path d="M16,24 C2,18 -9,10 -6,2 C4,2 12,12 16,24 Z" fill="#A655D9" />
      <circle cx="16" cy="24" r="3" fill="#FBF7EE" />
    </g>
    <g transform="translate(222, 354) scale(1, -1)">
      <path d="M16,24 C8,10 5,-4 13,-10 C21,-4 23,10 16,24 Z" fill="#F5BF4F" />
      <path d="M16,24 C2,18 -9,10 -6,2 C4,2 12,12 16,24 Z" fill="#A655D9" />
      <circle cx="16" cy="24" r="3" fill="#FBF7EE" />
    </g>

    <!-- Oversized Central Diamond Medallion docked cleanly into the right rail (centered x=156, y=190) -->
    <!-- Outer dotted diamond halo -->
    <polygon
      points="156,48 262,190 156,332 50,190"
      stroke="#FBF7EE"
      stroke-width="2.4"
      stroke-dasharray="3 9"
      opacity="0.9"
    />
    <!-- Outer royal violet diamond frame -->
    <polygon
      points="156,64 250,190 156,316 62,190"
      stroke="#A655D9"
      stroke-width="4"
      fill="#481663"
      fill-opacity="0.58"
    />
    <!-- Inner golden hairline diamond -->
    <polygon
      points="156,80 238,190 156,300 74,190"
      stroke="#F5BF4F"
      stroke-width="2"
      fill="#2C0A3F"
      fill-opacity="0.74"
    />
    <!-- Innermost dotted diamond -->
    <polygon
      points="156,94 227,190 156,286 85,190"
      stroke="#F5BF4F"
      stroke-width="1.8"
      stroke-dasharray="2.5 7.5"
      opacity="0.88"
    />

    <!-- Re-draw inner gold rail slightly over diamond right vertex for crisp textile overlap -->
    <line x1="252" y1="0" x2="252" y2="380" stroke="#F5BF4F" stroke-width="2.6" />

    <!-- Left tip accent pearls -->
    <circle cx="38" cy="190" r="4.5" fill="#F5BF4F" />
    <circle cx="24" cy="190" r="2.6" fill="#A655D9" />

    <!-- Central 8-Petal Gujarati Lotus Blossom (centered at 156, 190) -->
    <g transform="translate(156, 190)">
      <!-- Diagonal lavender secondary petals -->
      <path d="M0,0 C-14,-22 -32,-30 -40,-40 C-24,-35 -14,-22 0,0 Z" fill="#A655D9" />
      <path d="M0,0 C14,-22 32,-30 40,-40 C24,-35 14,-22 0,0 Z" fill="#A655D9" />
      <path d="M0,0 C-14,22 -32,30 -40,40 C-24,35 -14,22 0,0 Z" fill="#A655D9" />
      <path d="M0,0 C14,22 32,30 40,40 C24,35 14,22 0,0 Z" fill="#A655D9" />

      <!-- Cardinal golden primary lotus petals -->
      <path d="M0,-8 C-14,-24 -13,-48 0,-64 C13,-48 14,-24 0,-8 Z" fill="#F5BF4F" />
      <path d="M0,8 C-14,24 -13,48 0,64 C13,48 14,24 0,8 Z" fill="#F5BF4F" />
      <path d="M-8,0 C-24,-14 -48,-13 -64,0 C-48,13 -24,14 -8,0 Z" fill="#F5BF4F" />
      <path d="M8,0 C24,-14 48,-13 64,0 C48,13 24,14 8,0 Z" fill="#F5BF4F" />

      <!-- Diagonal golden teardrop petals -->
      <path d="M-6,-6 C-18,-10 -30,-18 -37,-37 C-18,-30 -10,-18 -6,-6 Z" fill="#F5BF4F" opacity="0.94" />
      <path d="M6,-6 C18,-10 30,-18 37,-37 C18,-30 10,-18 6,-6 Z" fill="#F5BF4F" opacity="0.94" />
      <path d="M-6,6 C-18,10 -30,18 -37,37 C-18,30 -10,18 -6,6 Z" fill="#F5BF4F" opacity="0.94" />
      <path d="M6,6 C18,10 30,18 37,37 C18,30 10,18 6,6 Z" fill="#F5BF4F" opacity="0.94" />

      <!-- Inner plum ring & bright ivory-gold rosette core -->
      <circle cx="0" cy="0" r="18" fill="#330C47" stroke="#FBF7EE" stroke-width="2" />
      <circle cx="0" cy="0" r="9.5" fill="#A655D9" />
      <circle cx="0" cy="0" r="4.6" fill="#F5BF4F" />

      <!-- Tiny ivory dots around outer petal tips -->
      <circle cx="0" cy="-72" r="2.8" fill="#FBF7EE" />
      <circle cx="0" cy="72" r="2.8" fill="#FBF7EE" />
      <circle cx="-72" cy="0" r="2.8" fill="#FBF7EE" />
      <circle cx="72" cy="0" r="2.8" fill="#FBF7EE" />
    </g>
  </g>
</svg>
