services:
  postgres:
    image: postgres:16-alpine
    container_name: pfg2027-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pfg_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pfg2027_change_me}
      POSTGRES_DB: purple_festival_gujarat_2027
    ports:
      - "5432:5432"
    volumes:
      - pfg2027_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfg_admin -d purple_festival_gujarat_2027"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pfg2027_pgdata:

