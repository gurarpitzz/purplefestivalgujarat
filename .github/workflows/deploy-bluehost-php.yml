name: Build & Package Native PHP+MySQL Site for Bluehost

on:
  push:
    branches: [main, php-mysql-migration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, json, openssl

      - name: Validate PHP syntax across all files
        run: |
          find . -maxdepth 4 -name "*.php" -not -path "./node_modules/*" -print0 | xargs -0 -n1 php -l

      - name: Package Bluehost PHP document root archive
        run: |
          rm -f database/*.sqlite*
          tar -czf bluehost-php-site.tar.gz \
            .htaccess \
            .cpanel.yml \
            index.php \
            login.php \
            programme.php \
            accessibility.php \
            admin \
            api \
            apply \
            assets \
            auth \
            dashboard \
            database \
            includes \
            legal \
            rgst

      - name: Upload to latest-php-build GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-php-build --yes || true
          gh release create latest-php-build bluehost-php-site.tar.gz \
            --title "Bluehost Native PHP + MySQL Site (latest)" \
            --notes "Complete native HTML5 + CSS3 + Vanilla JS + GSAP + PHP + MySQL deployment archive for Bluehost Apache."
