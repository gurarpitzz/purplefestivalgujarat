name: Build & Package Native PHP+MySQL Site for Bluehost

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-php-release
  cancel-in-progress: true

jobs:
  package-php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, json, openssl, zip

      - name: Build clean Bluehost PHP release package, zip archive & manifest
        run: |
          rm -rf dist
          php scripts/build-release-package.php \
            --out=dist/public_html \
            --zip=dist/bluehost-php-site.zip \
            --json
          tar -czf dist/bluehost-php-site.tar.gz -C dist/public_html .

      - name: Upload to latest-php-build GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest-php-build \
            dist/bluehost-php-site.zip \
            dist/bluehost-php-site.tar.gz \
            dist/RELEASE_MANIFEST.json \
            --clobber || \
          gh release create latest-php-build \
            dist/bluehost-php-site.zip \
            dist/bluehost-php-site.tar.gz \
            dist/RELEASE_MANIFEST.json \
            --title "Bluehost Native PHP + MySQL Site (latest)" \
            --notes "Verified Bluehost Apache native PHP + MySQL deployment package (.zip, .tar.gz, and RELEASE_MANIFEST.json) generated by scripts/build-release-package.php."
